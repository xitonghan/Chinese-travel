name: build-apk

# 推送代码或手动触发时，自动构建可安装的测试版 APK。
# 构建产物在 Actions 运行页的 Artifacts 里下载（app-debug.apk，已签名可直接安装）。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: install-deps
        run: flutter pub get

      - name: generate-android-scaffold
        run: flutter create . --platforms=android

      # flutter create 会顺带生成两个破坏静态分析的文件：
      # test/widget_test.dart 引用不存在的 MyApp；analysis_options.yaml 引用
      # 未安装的 flutter_lints。v0.1 无测试，直接清掉。
      - name: drop-generated-template-noise
        run: |
          rm -rf test
          rm -f analysis_options.yaml

      # record 5.x 插件硬性要求 minSdk 23；flutter 模板默认 21，不提升必然挂在清单合并。
      # 覆盖所有已知模板写法（Kotlin DSL / Groovy，具名 / 数字 / 引用属性），改完硬校验。
      - name: force-minSdk-23
        run: |
          set -e
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk([[:space:]]*)=.*/minSdk = 23/' "$f"
            sed -i -E 's/minSdkVersion[[:space:]].*/minSdkVersion 23/' "$f"
          done
          echo "--- effective minSdk lines ---"
          grep -nE "minSdk" android/app/build.gradle* || true
          if ! grep -qE "minSdk(Version)?[[:space:]]*=?[[:space:]]*23" android/app/build.gradle*; then
            echo "::error::minSdk 23 did not take effect - template syntax may have changed"
            exit 1
          fi

      # 仓库已自带含 RECORD_AUDIO 的清单；此步仅作双保险，缺了才补。
      - name: ensure-record-permission
        run: |
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' android/app/src/main/AndroidManifest.xml
          fi

      # Dart 代码错误在这步单独曝光，不用去 Gradle 输出里翻。
      # 输出同时写入 analyze.log 并逐行转成 GitHub 注解（::error::）——
      # 运行页"Annotations"与 REST API 都能读到，便于远程定位真实错误。
      - name: dart-analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          set -e
          echo "----- flutter analyze output (exit $code) -----"
          cat analyze.log
          { grep ' error ' analyze.log || true; } | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          { grep -v ' error ' analyze.log || true; } | head -20 | while IFS= read -r line; do
            printf '::warning::%s\n' "$line"
          done
          printf '::error::analyze exit code %s\n' "$code"
          exit $code

      - name: upload-analyze-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: warn

      - name: build-debug-apk
        run: |
          set +e
          flutter build apk --debug > build.log 2>&1
          code=$?
          set -e
          echo "----- flutter build output (exit $code) -----"
          tail -60 build.log
          { grep -inE 'error|failure|exception|caused by|what went wrong|went wrong' build.log || true; } | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          printf '::error::build exit code %s\n' "$code"
          exit $code

      - name: upload-build-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: chinese-travel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
