name: build-apk

# 推送代码 / 打版本 tag（v*）/ 手动触发时，自动构建可安装的测试版 APK。
# - 每次构建：产物在 Actions 运行页的 Artifacts 里（app-debug.apk，可直接安装）
# - 打 tag（如 v0.1）：构建成功后自动创建 GitHub Release，APK 永久可下载
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: install-deps
        run: flutter pub get

      - name: generate-android-scaffold
        run: flutter create . --platforms=android

      # flutter create 会顺带生成两个破坏静态分析的文件：
      # test/widget_test.dart 引用不存在的 MyApp；analysis_options.yaml 引用
      # 未安装的 flutter_lints。v0.1 无测试，直接清掉。
      - name: drop-generated-template-noise
        run: |
          rm -rf test
          rm -f analysis_options.yaml

      # record 5.x 插件硬性要求 minSdk 23；flutter 模板默认 21，不提升必然挂在清单合并。
      # 覆盖所有已知模板写法（Kotlin DSL / Groovy，具名 / 数字 / 引用属性），改完硬校验。
      - name: force-minSdk-23
        run: |
          set -e
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk([[:space:]]*)=.*/minSdk = 23/' "$f"
            sed -i -E 's/minSdkVersion[[:space:]].*/minSdkVersion 23/' "$f"
          done
          echo "--- effective minSdk lines ---"
          grep -nE "minSdk" android/app/build.gradle* || true
          if ! grep -qE "minSdk(Version)?[[:space:]]*=?[[:space:]]*23" android/app/build.gradle*; then
            echo "::error::minSdk 23 did not take effect - template syntax may have changed"
            exit 1
          fi

      # 仓库已自带含 RECORD_AUDIO 的清单；此步仅作双保险，缺了才补。
      - name: ensure-record-permission
        run: |
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' android/app/src/main/AndroidManifest.xml
          fi

      # Dart 代码错误在这步单独曝光，不用去 Gradle 输出里翻。
      # 输出同时写入 analyze.log 并逐行转成 GitHub 注解（::error::）——
      # 运行页"Annotations"与 REST API 都能读到，便于远程定位真实错误。
      - name: dart-analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          code=$?
          set -e
          echo "----- flutter analyze output (exit $code) -----"
          cat analyze.log
          { grep ' error ' analyze.log || true; } | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          { grep -v ' error ' analyze.log || true; } | head -20 | while IFS= read -r line; do
            printf '::warning::%s\n' "$line"
          done
          printf '::error::analyze exit code %s\n' "$code"
          exit $code

      - name: upload-analyze-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: warn

      - name: build-debug-apk
        run: |
          set +e
          flutter build apk --debug > build.log 2>&1
          code=$?
          set -e
          echo "----- flutter build output (exit $code) -----"
          tail -60 build.log
          { grep -inE 'error|failure|exception|caused by|what went wrong|went wrong' build.log || true; } | head -30 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          printf '::error::build exit code %s\n' "$code"
          exit $code

      - name: upload-build-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: chinese-travel-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # 打版本 tag（v0.1 / v0.2 ...）时：构建成功后自动建 Release 并附上 APK。
  # Artifacts 有保留期会过期，Release 是永久下载位——给朋友分发用这个。
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chinese-travel-debug-apk
          path: dist

      # 文件名用 ASCII：朋友手机是阿拉伯语系统，中文文件名可能显示为方块。
      - name: rename-apk
        run: mv dist/app-debug.apk "dist/chinese-travel-${{ github.ref_name }}.apk"

      - name: create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Chinese Travel ${{ github.ref_name }} - first testable build

          ### What's inside
          - Lesson 1 "At the airport": dialogue, vocabulary, sentence patterns, shadowing with pitch comparison, quiz
          - Arabic interface (RTL), switchable to English
          - Pronunciation comparison runs fully on-device (pitch curve, no internet, no account)

          ### Install
          1. Download the APK and transfer it to the phone
          2. Tap to install; if Android warns about "unknown sources", allow it
          3. No account, no internet needed

          ### 中文说明
          首个可测试版本：含「在机场」第 1 课（对话/词汇/句型/跟读对比/测验），
          阿拉伯语界面，跟读对比为本地音高计算。APK 传到手机点击安装，
          提示"未知来源应用"时点允许即可。无需账号、无需联网。
          NOTES
          gh release create "${{ github.ref_name }}" \
            dist/*.apk \
            --title "Chinese Travel ${{ github.ref_name }} (test build)" \
            --notes-file notes.md
